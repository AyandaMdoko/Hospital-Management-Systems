<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/authentication-styles.css">
    <title>Reset Password | Hospital Management System</title>
</head>
<body class="reset-password-page">
    <!-- Header with return-to-login navigation -->
    <header class="login-header">
        <div class="login-header-content">
            <a class="login-brand" href="index.html" aria-label="Hospital Management System home">
                <span class="login-brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 48 48"><path d="M24 42S6 31.2 6 17.8C6 10.7 14.8 6.4 21 12l3 3 3-3c6.2-5.6 15-1.3 15 5.8C42 31.2 24 42 24 42Z"/><path class="pulse" d="M9 24h9l4-8 6.2 16 4.1-8H39"/></svg>
                </span>
                <span class="login-brand-name">Hospital Management<span>System</span></span>
            </a>
            <a class="back-home" href="user-login.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Login</a>
        </div>
    </header>

    <main class="reset-password-main">
        <section class="reset-password-card" aria-labelledby="reset-password-title">
            <div class="reset-password-heading">
                <span class="reset-password-icon" aria-hidden="true"><i class="bi bi-shield-check"></i></span>
                <h1 id="reset-password-title">HMS | User Password Reset</h1>
            </div>

            <form action="#" id="resetForm" method="post" class="reset-password-form">
                <fieldset>
                    <legend><i class="bi bi-key-fill" aria-hidden="true"></i> Reset Password</legend>

                    <label for="new-password"><i class="bi bi-lock" aria-hidden="true"></i> New Password</label>
                    <div class="reset-password-field">
                        <input type="password" name="password" id="new-password" autocomplete="new-password" minlength="8" required>
                    </div>
                    <label for="confirm-password"><i class="bi bi-lock-fill" aria-hidden="true"></i> Confirm New Password</label>
                    <div class="reset-password-field">
                        <input type="password" name="confirm-password" id="confirm-password" autocomplete="new-password" minlength="8" required>
                    </div>
                    <label class="show-password-control" for="show-passwords">
                        <input type="checkbox" class="show-password-checkbox" id="show-passwords">
                        <span>Show passwords</span>
                    </label>

                    <p class="password-error" id="passwordError" aria-live="polite"></p>

                    <div class="form-actions">
                        <button type="submit" class="login-button" name="submit"><i class="bi bi-check2-circle" aria-hidden="true"></i> Reset</button>
                    </div>

                    <p class="new-account">Already have an account? <a href="user-login.html">Log in</a></p>
                </fieldset>
            </form>

            <div class="copyright">
                <span class="text-bold text-uppercase">Hospital Management System</span>
            </div>
        </section>
    </main>
    <script src="assets/js/script.js"></script>
</body>
</html>
